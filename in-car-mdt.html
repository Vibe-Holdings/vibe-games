<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VHPD In-Car MDT</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef1f4;color:#17202a}
.top{background:#101820;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
.logo{width:38px;height:38px;border-radius:8px;object-fit:cover;background:#fff}.title{font-size:19px;font-weight:700}.sub{font-size:12px;opacity:.7}
.wrap{max-width:1200px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{background:#fff;border:1px solid #d9e0e6;border-radius:12px;padding:16px;box-shadow:0 2px 8px #0000000b}
button{font:inherit;cursor:pointer}.tile{border:1px solid #d9e0e6;background:#fff;border-radius:12px;padding:18px;text-align:left;min-height:105px}.tile:hover{transform:translateY(-1px);box-shadow:0 4px 12px #0002}.tile b{display:block;margin:7px 0}.muted{color:#66717c;font-size:13px}
.primary,.secondary{border:0;border-radius:8px;padding:10px 14px;margin:4px 4px 4px 0}.primary{background:#101820;color:#fff}.secondary{background:#e9edf1;color:#17202a}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd3da;border-radius:8px;margin:5px 0 10px;background:#fff}label{font-size:13px;font-weight:700;display:block}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.grow{flex:1}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#e9edf1}.red{background:#f9dddd}.green{background:#dff3e4}.amber{background:#fff0c9}
.notice{padding:10px;border-radius:8px;margin:10px 0;background:#e9f1ff}.error{background:#f9dddd}.call{border-left:5px solid #101820;margin:10px 0}.hidden{display:none}
footer{text-align:center;padding:20px;color:#7a838c;font-size:11px}
</style>
</head>
<body>
<header class="top">
<img class="logo" src="https://cdn.phototourl.com/free/2026-08-26-86cb6b53-6054-4849-8cbc-f163d7ac51c4.png">
<div><div class="title">VHPD In-Car MDT</div><div class="sub">Mobile Data Terminal</div></div>
<div class="grow"></div><div id="officerTop" class="sub">Officer</div>
</header>
<div class="wrap"><div style="margin-bottom:12px"><button class="secondary" id="menuBack" type="button">← Main Menu</button></div>
<section id="home">
<h1>In-Car MDT</h1><p class="muted">Police services available from this vehicle.</p>
<div class="grid">
<button class="tile" data-page="people">👤<b>People Lookup</b><span class="muted">Search the people database</span></button>
<button class="tile" data-page="vehicles">🚗<b>Vehicle Lookup</b><span class="muted">Search vehicle records</span></button>
<button class="tile" data-page="tickets">🎫<b>Tickets</b><span class="muted">View and manage tickets</span></button>
<button class="tile" data-page="calls">🚨<b>Active Calls</b><span class="muted">Current incidents and calls</span></button>
<button class="tile" data-page="dispatch">📻<b>Dispatch</b><span class="muted">Unit and call information</span></button>
<button class="tile" data-page="cases">📁<b>Cases</b><span class="muted">Case management</span></button>
<button class="tile" data-page="requests">📋<b>Data Requests</b><span class="muted">Officer data requests</span></button>
<button class="tile" data-page="status">👮<b>Officer Status</b><span class="muted">Set your current status</span></button>
<button class="tile" data-page="location">📍<b>Location</b><span class="muted">Set or view vehicle location</span></button>
</div>
</section>
<section id="app" class="hidden"></section>
</div>
<footer>Roleplay System</footer>
<script>
document.addEventListener("DOMContentLoaded",function(){
const SUPABASE_URL="https://hrqhwfbhqpjhmuvdrrzp.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhycWh3ZmJocXBqaG11dmRycnpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0Mjk3MzksImV4cCI6MjEwMzAwNTczOX0.s3PFWbFOqw8tvlviwYQ8ujutdvU3B1iEJq3R8w_DSSc";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const officer=JSON.parse(localStorage.getItem("vhpd_officer")||"null")||{first_name:"Officer",last_name:""};
const name=p=>[p?.first_name,p?.middle_name,p?.last_name].filter(Boolean).join(" ")||"Officer";
$("officerTop").textContent=name(officer);
const home=$("home"),app=$("app");
function page(title,body){home.classList.add("hidden");app.classList.remove("hidden");app.innerHTML=`<button class="secondary" id="mdtHome" type="button">← MDT Home</button><div class="card"><h2>${title}</h2>${body}</div>`;$("mdtHome").onclick=homePage}
function homePage(){app.classList.add("hidden");home.classList.remove("hidden")}
function field(p,ks){for(const k of ks)if(p?.[k]!=null&&String(p[k]).trim())return String(p[k]);return ""}

async function people(){
page("People Lookup",`<div class="grid"><div><label>First name</label><input id="pf"></div><div><label>Gender</label><select id="pg"><option value="">Any</option><option>Male</option><option>Female</option><option>Other</option></select></div><div><label>Location</label><input id="pl"></div><div><label>Search</label><input id="pq" placeholder="Name or reference"></div></div><button class="primary" id="peopleSearch" type="button">Search</button><div id="peopleResults">Loading…</div>`);
try{const r=await sb.from("persons").select("*").order("last_name",{ascending:true});if(r.error){$("peopleResults").innerHTML=`<div class="notice error">${esc(r.error.message)}</div>`;return}const data=r.data||[];const render=()=>{const q=$("pq").value.toLowerCase(),f=$("pf").value.toLowerCase(),g=$("pg").value.toLowerCase(),l=$("pl").value.toLowerCase();const rows=data.filter(p=>{const n=name(p).toLowerCase(),ref=field(p,["reference","person_reference"]).toLowerCase(),fn=field(p,["first_name"]).toLowerCase(),gg=field(p,["gender","sex"]).toLowerCase(),ll=field(p,["location","address","town","city"]).toLowerCase();return(!q||(n.includes(q)||ref.includes(q)))&&(!f||fn.includes(f))&&(!g||gg===g)&&(!l||ll.includes(l))});$("peopleResults").innerHTML=rows.map(p=>`<div class="card"><b>${esc(name(p))}</b><p class="muted">${esc(field(p,["reference"])||"No reference")} · ${esc(field(p,["location","town","city","address"])||"No location")}</p></div>`).join("")||"<p class=muted>No matches.</p>"};$("peopleSearch").onclick=render;render()}catch(e){$("peopleResults").innerHTML=`<div class="notice error">${esc(e.message)}</div>`}
}
async function vehicles(){
page("Vehicle Lookup",`<label>Registration</label><input id="reg" placeholder="Registration"><button class="primary" id="vehicleSearch" type="button">Search Vehicle</button><div id="vehicleResults"></div>`);
$("vehicleSearch").onclick=async()=>{const q=$("reg").value.trim();if(!q)return;$("vehicleResults").textContent="Searching…";const r=await sb.from("vehicles").select("*").ilike("registration",q).maybeSingle();$("vehicleResults").innerHTML=r.error?`<div class="notice error">${esc(r.error.message)}</div>`:r.data?`<div class="card"><b>${esc(r.data.registration)}</b><p>${esc(r.data.make||"")} ${esc(r.data.model||"")}</p><p>Colour: ${esc(r.data.colour||"—")}</p><p>Status: ${esc(r.data.status||"—")}</p></div>`:"<div class=notice>No vehicle found.</div>"}
}
function tickets(){page("Tickets","<p class=muted>Ticket services are available through the VHPD Police System.</p><button class=primary id=ticketSystem type=button>Open Police System</button>");$("ticketSystem").onclick=()=>location.href="police-system.html"}
async function calls(){page("Active Calls","<div id=callsResults>Loading calls…</div>");const r=await sb.from("incidents").select("*").order("created_at",{ascending:false}).limit(50);$("callsResults").innerHTML=r.error?`<div class="notice error">${esc(r.error.message)}</div>`:(r.data||[]).map(x=>`<div class="card call"><b>${esc(x.title||x.incident_number||"Call")}</b><p>${esc(x.location||"Location unavailable")}</p><span class=badge>${esc(x.priority||"Standard")}</span></div>`).join("")||"<p>No active calls.</p>"}
function dispatch(){page("Dispatch",`<p class=muted>Dispatch information and unit status.</p><button class=primary id=dispatchStatus type=button>Set Officer Status</button>`);$("dispatchStatus").onclick=statusPage}
function cases(){page("Cases","<p class=muted>Case management is available through the Police System.</p><button class=primary id=caseSystem type=button>Open Police System</button>");$("caseSystem").onclick=()=>location.href="police-system.html"}
async function requests(){page("Data Requests","<div id=requestResults>Loading requests…</div>");const r=await sb.from("data_requests").select("*").order("requested_at",{ascending:false}).limit(50);$("requestResults").innerHTML=r.error?`<div class="notice error">${esc(r.error.message)}</div>`:(r.data||[]).map(x=>`<div class=card><b>${esc(x.request_number||x.id)}</b> — ${esc(x.status||"Pending")}<p>${esc(x.reason||"")}</p></div>`).join("")||"<p>No requests.</p>"}
function statusPage(){page("Officer Status",`<label>Status</label><select id=os><option>Available</option><option>En Route</option><option>On Scene</option><option>Busy</option><option>Meal</option><option>Off Duty</option></select><button class=primary id=setStatus type=button>Set Status</button><div id=statusResult></div>`);$("setStatus").onclick=()=>{localStorage.setItem("vhpd_officer_status",$("os").value);$("statusResult").innerHTML=`<div class=notice>Status set to <b>${esc($("os").value)}</b>.</div>`}}
function locationPage(){page("Vehicle Location",`<label>Current vehicle location</label><input id=loc placeholder="e.g. Whitburn High Street"><button class=primary id=setLocation type=button>Save Location</button><div id=locationResult></div>`);$("loc").value=localStorage.getItem("vhpd_mdt_location")||"";$("setLocation").onclick=()=>{localStorage.setItem("vhpd_mdt_location",$("loc").value);$("locationResult").innerHTML="<div class=notice>Vehicle location saved.</div>"}}
const actions={people,vehicles,tickets,calls,dispatch,cases,requests,status:statusPage,location:locationPage};
document.querySelectorAll("[data-page]").forEach(btn=>btn.addEventListener("click",function(){const fn=actions[this.dataset.page];if(fn)fn()}));
});
</script>
