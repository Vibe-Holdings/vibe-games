<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>VHPD Police Management System</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f3f5f7;color:#17212b}header{background:#12304a;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}header h1{font-size:20px;margin:0}header small{opacity:.8}nav{width:230px;background:#fff;border-right:1px solid #d8dee5;position:fixed;top:76px;bottom:0;padding:14px}nav button{width:100%;padding:13px;margin-bottom:8px;text-align:left;background:#fff;border:1px solid #d8dee5;border-radius:10px;font-weight:700}nav button.active{background:#173f5f;color:#fff}main{margin-left:230px;padding:22px;max-width:1400px}.card{background:#fff;border:1px solid #d8dee5;border-radius:14px;padding:18px;margin-bottom:16px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-weight:700;font-size:13px;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5df;border-radius:9px;font:inherit}textarea{min-height:110px}button.action{padding:10px 14px;border:0;border-radius:9px;background:#173f5f;color:#fff;font-weight:700}button.secondary{padding:10px 14px;border:1px solid #cbd5df;border-radius:9px;background:#fff;font-weight:700}button.danger{padding:10px 14px;border:1px solid #fecaca;border-radius:9px;background:#fee2e2;color:#991b1b;font-weight:700}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #e5e7eb}th{background:#f7f8fa}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#e8eef5;font-size:12px;font-weight:700}.muted{color:#687786}.notice{padding:12px;border-radius:9px;margin-bottom:14px}.error{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid #d8dee5;border-radius:12px;padding:14px}.stat b{display:block;font-size:24px;margin-top:5px}@media(max-width:750px){nav{position:static;width:auto;display:flex;overflow:auto;padding:8px}nav button{min-width:130px}.desktop-only{display:none}main{margin:0;padding:10px}.grid{display:block}.statgrid{grid-template-columns:1fr}header{position:sticky;top:0;z-index:10}}
</style></head><body><header><div><h1>VHPD Police Management System</h1><small>Investigation & Records Management</small></div><button id="refresh" class="secondary">↻ Refresh</button></header><nav id="nav"><button data-tab="cases">Cases</button><button data-tab="archive">Case Archive</button><button data-tab="incidents">Incidents</button><button data-tab="people">People</button><button data-tab="officers">Officers</button><button data-tab="evidence">Evidence</button><button data-tab="statements">Statements</button><button data-tab="tasks">Tasks</button><button data-tab="reports">Reports</button></nav><main><div id="notice"></div><div id="app">Loading records…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL="https://hrqhwfbhqpjhmuvdrrzp.supabase.co",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhycWh3ZmJocXBqaG11dmRycnpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0Mjk3MzksImV4cCI6MjEwMzAwNTczOX0.s3PFWbFOqw8tvlviwYQ8ujutdvB3U1iEJq3R8w_DSSc";let db=null,tab='cases',data={cases:[],people:[],officers:[],incidents:[],evidence:[],statements:[],tasks:[],reports:[]};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function note(t,e=false){$('notice').innerHTML='<div class="notice '+(e?'error':'ok')+'">'+esc(t)+'</div>';setTimeout(()=>{$('notice').innerHTML=''},4000)}
async function get(t){try{let q=db.from(t).select('*');let r=await q;if(r.error){console.warn(t,r.error.message);return []}return r.data||[]}catch(e){return []}}
async function load(){if(!window.supabase){$('app').innerHTML='<div class="card"><h2>Database library unavailable</h2></div>';return}db=window.supabase.createClient(URL,KEY);[data.cases,data.people,data.officers,data.incidents,data.evidence,data.statements,data.tasks,data.reports]=await Promise.all(['cases','persons','officers','incidents','evidence','statements','tasks','reports'].map(get));render()}
function setTab(t){tab=t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function render(){if(tab==='cases')casesPage();else if(tab==='archive')archivePage();else listPage(tab)}
function casesPage(){let open=data.cases.filter(c=>c.status!=='Closed');$('app').innerHTML='<div class="row"><div><h2>Cases</h2><p class="muted">Cases are retained and cannot be deleted.</p></div><button class="action" data-action="new-case">+ New Case</button></div><div class="statgrid"><div class="stat">Total<b>'+data.cases.length+'</b></div><div class="stat">Open<b>'+open.length+'</b></div><div class="stat">Closed<b>'+data.cases.filter(c=>c.status==='Closed').length+'</b></div><div class="stat">Critical<b>'+data.cases.filter(c=>c.priority==='Critical').length+'</b></div></div><div class="card"><input id="caseSearch" placeholder="Search case number, title, category…"></div><div class="card"><div style="overflow:auto"><table><thead><tr><th>Case</th><th>Title</th><th>Status</th><th>Priority</th><th>Category</th><th>Actions</th></tr></thead><tbody id="caseRows"></tbody></table></div></div>';renderCaseRows();$('caseSearch').oninput=renderCaseRows}
function renderCaseRows(){let q=($('caseSearch')?.value||'').toLowerCase();let rows=data.cases.filter(c=>(String(c.number||c.case_number||'')+' '+String(c.title||'')+' '+String(c.category||'')).toLowerCase().includes(q));$('caseRows').innerHTML=rows.map(c=>'<tr><td><b>'+esc(c.number||c.case_number||'—')+'</b></td><td>'+esc(c.title||'—')+'</td><td><span class="badge">'+esc(c.status||'—')+'</span></td><td>'+esc(c.priority||'—')+'</td><td>'+esc(c.category||'—')+'</td><td><button class="secondary" data-action="open-case" data-id="'+esc(c.id)+'">Open</button> '+(c.status!=='Closed'?'<button class="action" data-action="close-case" data-id="'+esc(c.id)+'">Close</button>':'')+'</td></tr>').join('')||'<tr><td colspan="6">No cases found.</td></tr>'}
function archivePage(){let rows=data.cases.filter(c=>c.status==='Closed'||c.archived===true);$('app').innerHTML='<div class="card"><h2>Case Archive</h2><p class="muted">Closed cases remain available.</p><table><tr><th>Case</th><th>Title</th><th>Priority</th><th></th></tr>'+rows.map(c=>'<tr><td>'+esc(c.number||c.case_number)+'</td><td>'+esc(c.title)+'</td><td>'+esc(c.priority||'—')+'</td><td><button class="secondary" data-action="open-case" data-id="'+esc(c.id)+'">View</button></td></tr>').join('')+'</table></div>'}
function listPage(t){let titles={people:'People',officers:'Officers',incidents:'Incidents',evidence:'Evidence',statements:'Statements',tasks:'Tasks',reports:'Reports'};let rows=data[t]||[];$('app').innerHTML='<div class="card"><h2>'+titles[t]+'</h2><input id="listSearch" placeholder="Search '+titles[t].toLowerCase()+'…"><div style="overflow:auto"><table><thead><tr><th>Reference</th><th>Name / Description</th><th>Status</th></tr></thead><tbody id="listRows"></tbody></table></div></div>';let draw=()=>{let q=($('listSearch').value||'').toLowerCase();$('listRows').innerHTML=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).map(x=>'<tr><td>'+esc(x.reference||x.number||x.case_number||x.incident_number||x.evidence_number||x.statement_number||x.report_number||x.id||'—')+'</td><td>'+esc([x.first_name,x.last_name].filter(Boolean).join(' ')||x.title||x.description||x.text||x.statement||'—')+'</td><td>'+esc(x.status||'—')+'</td></tr>').join('')||'<tr><td colspan="3">No records found.</td></tr>'};$('listSearch').oninput=draw;draw()}
function newCase(){$('app').innerHTML='<div class="card"><h2>New Case</h2><div class="grid"><div><label>Case Number</label><input id="cn" value="VHPD-'+Date.now().toString().slice(-6)+'"></div><div><label>Title</label><input id="ct"></div><div><label>Priority</label><select id="cp"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select></div><div><label>Category</label><input id="cc"></div><div style="grid-column:1/-1"><label>Summary</label><textarea id="cs"></textarea></div></div><div class="actions"><button class="action" data-action="save-case">Create Case</button><button class="secondary" data-action="back-cases">Cancel</button></div></div>'}
async function saveCase(){let r=await db.from('cases').insert({number:$('cn').value.trim(),title:$('ct').value,priority:$('cp').value,category:$('cc').value,summary:$('cs').value,status:'Open',archived:false}).select().single();if(r.error){note(r.error.message,true);return}data.cases.unshift(r.data);note('Case created');setTab('cases')}
function openCase(id){let c=data.cases.find(x=>String(x.id)===String(id));if(!c)return;$('app').innerHTML='<div class="card"><h2>'+esc(c.number||c.case_number)+'</h2><p><b>'+esc(c.title||'')+'</b></p><p>'+esc(c.summary||'')+'</p><p>Status: '+esc(c.status||'')+' · Priority: '+esc(c.priority||'')+'</p><div class="actions"><button class="secondary" data-action="back-cases">← Back</button>'+ (c.status!=='Closed'?'<button class="action" data-action="close-case" data-id="'+esc(c.id)+'">Close Case</button>':'')+'</div><hr><h3>Statements</h3><p class="muted">Typed statement records only. Handwriting and e-signatures are not used.</p><textarea id="statementText" placeholder="Enter statement…"></textarea><button class="action" data-action="save-statement" data-id="'+esc(c.id)+'">Save Statement</button></div>'}
async function saveStatement(id){let text=$('statementText').value.trim();if(!text){note('Enter statement text.',true);return}let r=await db.from('statements').insert({case_id:id,text,status:'Recorded',created_at:new Date().toISOString()});if(r.error){note(r.error.message,true);return}note('Statement recorded');openCase(id)}
async function closeCase(id){let r=await db.from('cases').update({status:'Closed',archived:true,archived_at:new Date().toISOString()}).eq('id',id);if(r.error){note(r.error.message,true);return}let c=data.cases.find(x=>String(x.id)===String(id));if(c){c.status='Closed';c.archived=true}note('Case closed and archived');render()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(a==='new-case')newCase();else if(a==='save-case')saveCase();else if(a==='open-case')openCase(b.dataset.id);else if(a==='close-case')closeCase(b.dataset.id);else if(a==='back-cases')setTab('cases');else if(a==='save-statement')saveStatement(b.dataset.id)});document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));$('refresh').addEventListener('click',load);setTab('cases');load();
</script>
<script>
document.addEventListener("DOMContentLoaded", function(){
  const SUPABASE_URL="https://hrqhwfbhqpjhmuvdrrzp.supabase.co";
  const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhycWh3ZmJocXBqaG11dmRycnpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0Mjk3MzksImV4cCI6MjEwMzAwNTczOX0.s3PFWbFOqw8tvlviYwQ8ujutdvU3B1iEJq3R8w_DSSc";
  if(typeof supabase==="undefined") return;
  const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const findArea=()=>document.getElementById("area")||document.getElementById("content")||document.querySelector("main");

  window.vhpdPeoplePage=function(){
    const a=findArea(); if(!a)return;
    a.innerHTML=`<div class="card"><h2>People</h2>
      <div class="row"><button class="primary" id="vhpdAddPerson" type="button">Add Person</button><button class="secondary" id="vhpdRefreshPeople" type="button">Refresh</button></div>
      <div id="vhpdPeopleList">Loading people…</div></div>`;
    document.getElementById("vhpdAddPerson").onclick=window.vhpdAddPersonForm;
    document.getElementById("vhpdRefreshPeople").onclick=window.vhpdLoadPeople;
    window.vhpdLoadPeople();
  };
  window.vhpdLoadPeople=async function(){
    const box=document.getElementById("vhpdPeopleList"); if(!box)return;
    box.textContent="Loading people…";
    try{
      const r=await db.from("persons").select("*").order("last_name",{ascending:true});
      if(r.error){box.innerHTML=`<div class="notice error">Database error: ${esc(r.error.message)}</div>`;return}
      const rows=r.data||[];
      box.innerHTML=rows.map(p=>`<div class="card"><b>${esc([p.first_name,p.middle_name,p.last_name].filter(Boolean).join(" ")||"Unnamed")}</b><div class="muted">${esc(p.reference||"")} · ${esc(p.gender||"Unknown")} · ${esc(p.location||p.address||"")}</div></div>`).join("")||"<p>No people in database.</p>";
    }catch(e){box.innerHTML=`<div class="notice error">${esc(e.message)}</div>`}
  };
  window.vhpdAddPersonForm=function(){
    const a=findArea();if(!a)return;
    a.innerHTML=`<div class="card"><h2>Add Person</h2>
      <label>First name *</label><input id="apFirst" autocomplete="off">
      <label>Middle name</label><input id="apMiddle" autocomplete="off">
      <label>Last name *</label><input id="apLast" autocomplete="off">
      <label>Date of birth</label><input id="apDob" type="date">
      <label>Gender</label><select id="apGender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option><option>Unknown</option></select>
      <label>Location / Address</label><input id="apLocation" autocomplete="street-address">
      <label>Reference</label><input id="apRef" placeholder="Optional">
      <div class="row"><button class="primary" id="savePerson" type="button">Save Person</button><button class="secondary" id="cancelPerson" type="button">Cancel</button></div>
      <div id="saveResult"></div></div>`;
    document.getElementById("cancelPerson").onclick=window.vhpdPeoplePage;
    document.getElementById("savePerson").onclick=window.vhpdSavePerson;
  };
  window.vhpdSavePerson=async function(){
    const result=document.getElementById("saveResult");
    const first=document.getElementById("apFirst").value.trim(), last=document.getElementById("apLast").value.trim();
    if(!first||!last){result.innerHTML='<div class="notice error">First name and last name are required.</div>';return}
    const data={
      first_name:first,
      middle_name:document.getElementById("apMiddle").value.trim()||null,
      last_name:last,
      date_of_birth:document.getElementById("apDob").value||null,
      gender:document.getElementById("apGender").value||null,
      location:document.getElementById("apLocation").value.trim()||null,
      reference:document.getElementById("apRef").value.trim()||null
    };
    result.innerHTML='<div class="notice">Saving to database…</div>';
    try{
      const r=await db.from("persons").insert(data).select().single();
      if(r.error){result.innerHTML=`<div class="notice error"><b>Person was not saved.</b><br>${esc(r.error.message)}</div>`;return}
      result.innerHTML=`<div class="notice">Person saved successfully. Database ID: ${esc(r.data.id)}</div>`;
      setTimeout(window.vhpdPeoplePage,700);
    }catch(e){result.innerHTML=`<div class="notice error">${esc(e.message)}</div>`}
  };

  // Universal click bridge: makes existing Police App menu buttons invoke the
  // correct section when their old handler is absent/broken.
  document.addEventListener("click",function(e){
    const b=e.target.closest("button,[role='button'],a");if(!b)return;
    const text=(b.textContent||"").trim().toLowerCase();
    const explicit=(b.dataset.section||b.dataset.action||"").toLowerCase();
    const key=explicit||text;
    if(/people|person|lookup/.test(key)){
      if(typeof window.showSection==="function"){try{window.showSection("people");return}catch(_){}}
      if(typeof window.vhpdPeoplePage==="function"){e.preventDefault();window.vhpdPeoplePage();return}
    }
  },true);
});
</script>
</body></html>
