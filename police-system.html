<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Vibe-Holdings Police Management System</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f3f5f7;color:#17212b}
header{background:#12304a;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px;margin:0}header small{opacity:.8}
nav{width:230px;background:#fff;border-right:1px solid #d8dee5;position:fixed;top:76px;bottom:0;padding:14px}
nav button{width:100%;padding:13px;margin-bottom:8px;text-align:left;background:#fff;border:1px solid #d8dee5;border-radius:10px;font-weight:700}
nav button.active{background:#173f5f;color:#fff}
main{margin-left:230px;padding:22px;max-width:1400px}
.card{background:#fff;border:1px solid #d8dee5;border-radius:14px;padding:18px;margin-bottom:16px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
label{font-weight:700;font-size:13px;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5df;border-radius:9px;font:inherit}textarea{min-height:110px}
button.action{padding:10px 14px;border:0;border-radius:9px;background:#173f5f;color:#fff;font-weight:700}button.secondary{padding:10px 14px;border:1px solid #cbd5df;border-radius:9px;background:#fff;font-weight:700}button.danger{padding:10px 14px;border:1px solid #fecaca;border-radius:9px;background:#fee2e2;color:#991b1b;font-weight:700}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #e5e7eb}th{background:#f7f8fa}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#e8eef5;font-size:12px;font-weight:700}.muted{color:#687786}.notice{padding:12px;border-radius:9px;margin-bottom:14px}.error{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid #d8dee5;border-radius:12px;padding:14px}.stat b{display:block;font-size:24px;margin-top:5px}
@media(max-width:750px){nav{position:static;width:auto;border:0;display:flex;overflow:auto;background:transparent;padding:8px}nav button{min-width:130px}.desktop-only{display:none}main{margin:0;padding:10px}.grid,.statgrid{grid-template-columns:1fr}header{position:sticky;top:0;z-index:10}}
</style>
</head>
<body>
<header>
 <div><h1>Vibe-Holdings Police Management System</h1><small>Investigation & Records Management • CLEAN BUILD v2026.08.23</small></div>
 <button class="secondary" onclick="location.reload()">↻ Refresh</button>
</header>
<nav id="nav">
 <button class="active" data-tab="cases">Cases</button>
 <button data-tab="archive">Case Archive</button>
 <button data-tab="incidents">Incidents</button>
 <button data-tab="people">People</button>
 <button data-tab="officers">Officers</button>
 <button data-tab="evidence">Evidence</button>
 <button data-tab="statements">Statements</button>
 <button data-tab="tasks">Tasks</button>
 <button data-tab="reports">Reports</button>
</nav>
<main>
 <div id="notice"></div>
 <div id="app">Loading clean build…</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* This file is deliberately self-contained. No old print/template code is used. */
const SUPABASE_URL="https://hrqhwfbhqpjhmuvdrrzp.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhycWh3ZmJocXBqaG11dmRycnpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0Mjk3MzksImV4cCI6MjEwMzAwNTczOX0.s3PFWbFOqw8tvlviwYQ8ujutdvU3B1iEJq3R8w_DSSc";
let sb=null;
let cases=[],people=[],officers=[],incidents=[],evidence=[],statements=[],tasks=[],reports=[];
let currentTab="cases";

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function note(msg,error=false){$("notice").innerHTML='<div class="notice '+(error?"error":"ok")+'">'+esc(msg)+'</div>';setTimeout(()=>$("notice").innerHTML="",5000)}
async function get(table,order){
 if(!sb)return [];
 let q=sb.from(table).select("*");
 if(order)q=q.order(order,{ascending:false});
 const r=await q;
 if(r.error){console.warn(table,r.error.message);return []}
 return r.data||[];
}
async function load(){
 $("app").innerHTML="Loading records…";
 if(!window.supabase){$("app").innerHTML='<div class="card"><h2>Supabase library failed to load</h2></div>';return}
 /* Supabase client is only created when a key is supplied. */
 if(!SUPABASE_KEY){
   $("app").innerHTML='<div class="card"><h2>Clean build is installed</h2><p>Supabase is configured. Loading records…</p></div>';
   return;
 }
 sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 [cases,people,officers,incidents,evidence,statements,tasks,reports]=await Promise.all([
   get("cases","created_at"),get("persons","created_at"),get("officers","created_at"),
   get("incidents","created_at"),get("evidence","created_at"),get("statements","created_at"),
   get("tasks","created_at"),get("reports","created_at")
 ]);
 render();
}
function render(){
 if(currentTab==="cases")renderCases();
 else if(currentTab==="archive")renderArchive();
 else if(currentTab==="people")simpleList("People",people,p=>[p.reference,[p.first_name,p.last_name].filter(Boolean).join(" ")]);
 else if(currentTab==="officers")simpleList("Officers",officers,p=>[p.collar_number,[p.first_name,p.last_name].filter(Boolean).join(" ")]);
 else if(currentTab==="incidents")simpleList("Incidents",incidents,p=>[p.incident_number,p.title]);
 else if(currentTab==="evidence")simpleList("Evidence",evidence,p=>[p.evidence_number,p.description]);
 else if(currentTab==="statements")simpleList("Statements",statements,p=>[p.statement_number,p.status]);
 else if(currentTab==="tasks")simpleList("Tasks",tasks,p=>[p.title,p.status]);
 else simpleList("Reports",reports,p=>[p.report_number,p.title]);
}
function renderCases(){
 const open=cases.filter(c=>c.status!=="Closed"&&c.archived!==true);
 $("app").innerHTML=`<div class="row"><div><h2>Cases</h2><p class="muted">Cases are retained. They cannot be deleted.</p></div><button class="action" onclick="newCase()">+ New Case</button></div>
 <div class="statgrid"><div class="stat">Total<b>${cases.length}</b></div><div class="stat">Open<b>${open.length}</b></div><div class="stat">Closed<b>${cases.filter(c=>c.status==="Closed").length}</b></div><div class="stat">Critical<b>${cases.filter(c=>c.priority==="Critical").length}</b></div></div>
 <div class="card"><input id="caseSearch" placeholder="Search case number, title, category…" oninput="renderCaseRows()"></div>
 <div class="card"><div style="overflow:auto"><table><thead><tr><th>Case</th><th>Title</th><th>Status</th><th>Priority</th><th>Category</th><th>Actions</th></tr></thead><tbody id="caseRows"></tbody></table></div></div>`;
 renderCaseRows();
}
function renderCaseRows(){
 const q=($("caseSearch")?.value||"").toLowerCase();
 const rows=cases.filter(c=>`${c.case_number||""} ${c.title||""} ${c.category||""}`.toLowerCase().includes(q));
 $("caseRows").innerHTML=rows.map(c=>`<tr><td><b>${esc(c.case_number||"—")}</b></td><td>${esc(c.title||"—")}</td><td><span class="badge">${esc(c.status||"—")}</span></td><td>${esc(c.priority||"—")}</td><td>${esc(c.category||"—")}</td><td><button class="secondary" onclick="openCase('${c.id}')">Open</button> ${c.status!=="Closed"?`<button class="action" onclick="closeCase('${c.id}')">Close & Archive</button>`:""}</td></tr>`).join("")||'<tr><td colspan="6">No cases found.</td></tr>';
}
function renderArchive(){
 const list=cases.filter(c=>c.status==="Closed"||c.archived===true);
 $("app").innerHTML=`<div class="card"><h2>Case Archive</h2><p class="muted">Closed cases remain available here and cannot be deleted.</p><div style="overflow:auto"><table><tr><th>Case</th><th>Title</th><th>Closed</th><th>Priority</th><th></th></tr>${list.map(c=>`<tr><td>${esc(c.case_number)}</td><td>${esc(c.title)}</td><td>${esc(c.archived_at||"—")}</td><td>${esc(c.priority||"—")}</td><td><button class="secondary" onclick="openCase('${c.id}')">View</button></td></tr>`).join("")||'<tr><td colspan="5">Archive empty.</td></tr>'}</table></div></div>`;
}
function openCase(id){
 const c=cases.find(x=>x.id===id);if(!c)return;
 $("app").innerHTML=`<div class="row"><div><h2>${esc(c.case_number)} — ${esc(c.title)}</h2><span class="badge">${esc(c.status||"—")}</span></div><button class="secondary" onclick="setTab('cases')">← Back</button></div>
 <div class="card"><p><b>Priority:</b> ${esc(c.priority||"—")}</p><p><b>Category:</b> ${esc(c.category||"—")}</p><p><b>Summary:</b><br>${esc(c.summary||"No summary.")}</p></div>
 <div class="card"><h3>Case Photos</h3><p class="muted">On a phone, choose the camera option to take a photo for this case.</p><input id="photoInput" type="file" accept="image/*" capture="environment"><div class="actions"><button class="action" onclick="uploadPhoto('${c.id}')">Upload Photo</button></div></div>
 <div class="actions">${c.status!=="Closed"?`<button class="action" onclick="closeCase('${c.id}')">Close & Archive</button>`:""}<button class="secondary" onclick="setTab('archive')">Case Archive</button></div>`;
}
async function closeCase(id){
 if(!confirm("Close and archive this case? The record will be retained."))return;
 if(!sb){note("Supabase is not configured.",true);return}
 const r=await sb.from("cases").update({status:"Closed",archived:true,archived_at:new Date().toISOString()}).eq("id",id);
 if(r.error){note("Could not close case: "+r.error.message,true);return}
 const c=cases.find(x=>x.id===id);if(c){c.status="Closed";c.archived=true;c.archived_at=new Date().toISOString()}
 note("Case closed and archived.");setTab("archive");
}
async function uploadPhoto(caseId){
 const f=$("photoInput")?.files?.[0];if(!f){note("Choose or take a photo first.",true);return}
 if(!sb){note("Supabase is not configured.",true);return}
 const path=`cases/${caseId}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;
 const u=await sb.storage.from("case-photos").upload(path,f);
 if(u.error){note("Photo upload failed: "+u.error.message,true);return}
 const r=await sb.from("case_photos").insert({case_id:caseId,storage_path:path,file_name:f.name,mime_type:f.type,size_bytes:f.size});
 if(r.error){note("Photo record failed: "+r.error.message,true);return}
 note("Photo uploaded to case.");$("photoInput").value="";
}
function newCase(){
 if(!sb){note("Supabase is not configured.",true);return}
 $("app").innerHTML=`<div class="card"><h2>New Case</h2><div class="grid"><div><label>Case Number</label><input id="cn" value="VIBE-${Date.now().toString().slice(-6)}"></div><div><label>Title</label><input id="ct"></div><div><label>Priority</label><select id="cp"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select></div><div><label>Category</label><input id="cc"></div><div style="grid-column:1/-1"><label>Summary</label><textarea id="cs"></textarea></div></div><div class="actions"><button class="action" onclick="saveCase()">Create Case</button><button class="secondary" onclick="setTab('cases')">Cancel</button></div></div>`;
}
async function saveCase(){
 const r=await sb.from("cases").insert({case_number:$("cn").value,title:$("ct").value,priority:$("cp").value,category:$("cc").value,summary:$("cs").value,status:"Open",archived:false}).select().single();
 if(r.error){note("Could not create case: "+r.error.message,true);return}
 cases.unshift(r.data);note("Case created.");setTab("cases");
}
function simpleList(title,data,mapper){
 $("app").innerHTML=`<div class="card"><h2>${title}</h2><div style="overflow:auto"><table><tr><th>Reference</th><th>Name / Description</th></tr>${data.map(x=>{let a=mapper(x);return `<tr><td>${esc(a[0])}</td><td>${esc(a[1])}</td></tr>`}).join("")||'<tr><td colspan="2">No records.</td></tr>'}</table></div></div>`;
}
function setTab(tab){currentTab=tab;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));render()}
document.querySelectorAll("#nav button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
load();
</script>
</body>
</html>
