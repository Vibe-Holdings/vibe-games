<!doctype html><html><head><script>(function(){try{if(!sessionStorage.getItem("police_session"))window.location.replace("/");}catch(e){window.location.replace("/");}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vibe-Holdings Police Management System</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#eef2f6;color:#17212b}header{height:64px;background:#102a43;color:white;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.brand{font-weight:800;font-size:18px}.brand small{display:block;font-size:10px;color:#c9d5df}button{border:0;border-radius:7px;padding:9px 13px;font-weight:700;cursor:pointer}.primary{background:#173f5f;color:white}.secondary{background:#e5edf3;color:#173047}.danger{background:#fee2e2;color:#991b1b}.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 64px)}nav{background:white;border-right:1px solid #d8e0e7;padding:12px;position:sticky;top:64px;height:calc(100vh - 64px)}nav button{display:block;width:100%;text-align:left;background:transparent;color:#253746;margin-bottom:4px}nav button.active{background:#173f5f;color:#fff}main{padding:22px;max-width:1500px;width:100%;margin:auto}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #dbe2e8;border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:0 2px 5px #00000008}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid #dbe2e8;border-radius:10px;padding:15px}.stat b{font-size:25px;display:block;margin-top:5px}h1{margin:0 0 5px;font-size:25px}h2{font-size:18px}label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}input,select,textarea{width:100%;padding:9px;border:1px solid #cbd5df;border-radius:7px;font:inherit}textarea{min-height:120px}.full{grid-column:1/-1}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.muted{font-size:12px;color:#687585}.badge{display:inline-block;padding:3px 7px;border-radius:12px;font-size:10px;font-weight:800;background:#dcfce7;color:#166534}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.show{display:flex}.modalbox{background:white;border-radius:12px;width:min(900px,100%);max-height:90vh;overflow:auto;padding:20px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:12px;vertical-align:top}th{background:#f5f7f9}.empty{text-align:center;padding:30px;color:#687585}.search{margin-bottom:12px}@media(max-width:900px){.layout{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;overflow:auto;gap:4px}nav button{width:auto;white-space:nowrap}.grid,.statgrid{grid-template-columns:1fr}main{padding:12px}}
</style>

<script id="anti-zoom-script">

</head><body><header><div class="brand">Vibe-Holdings Police Management System<small>Investigation & Records Management</small></div><div class="actions"><button class="secondary" onclick="loadAll()">↻ Refresh</button><button class="primary" onclick="newCase()">+ New Case</button></div></header><div class="layout"><nav id="nav"><button class="active" onclick="go('dashboard',this)">Dashboard</button><button onclick="go('cases',this)">Cases</button><button onclick="go('incidents',this)">Incidents</button><button onclick="go('people',this)">People</button><button onclick="go('officers',this)">Officers</button><button onclick="go('evidence',this)">Evidence</button><button onclick="go('statements',this)">Statements</button><button onclick="go('tasks',this)">Tasks</button><button onclick="go('reports',this)">Reports</button><button onclick="go('search',this)">Search</button></nav><main id="app">Loading...</main></div><div id="modal" class="modal"><div class="modalbox"><div class="row"><h2 id="mt">Record</h2><button class="secondary" onclick="closeModal()">Close</button></div><div id="mb"></div></div></div>
<script>
const URL='https://hrqhwfbhqpjhmuvdrrzp.supabase.co';const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhycWh3ZmJocXBqaG11dmRycnpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0Mjk3MzksImV4cCI6MjEwMzAwNTczOX0.s3PFWbFOqw8tvlviwYQ8ujutdvU3B1iEJq3R8w_DSSc';const sb=supabase.createClient(URL,KEY);let D={cases:[],incidents:[],persons:[],officers:[],evidence:[],statements:[],tasks:[],reports:[],events:[]};let page='dashboard';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const v=id=>document.getElementById(id)?.value.trim()||'';const form=(l,id,x='',a=false)=>`<div class="${a?'full':''}"><label>${l}</label>${a?`<textarea id="${id}">${esc(x)}</textarea>`:`<input id="${id}" value="${esc(x)}">`}</div>`;const sel=(l,id,o,x)=>`<div><label>${l}</label><select id="${id}">${o.map(z=>`<option ${z===x?'selected':''}>${esc(z)}</option>`).join('')}</select></div>`;
async function rows(t){let r=await sb.from(t).select('*').order('created_at',{ascending:false});if(r.error)throw r.error;return r.data||[]}async function add(t,x){let r=await sb.from(t).insert(x);if(r.error)throw r.error}async function del(t,id){let r=await sb.from(t).delete().eq('id',id);if(r.error)throw r.error}
async function loadAll(){try{for(let k of Object.keys(D))D[k]=await rows(k);render()}catch(e){app.innerHTML=`<div class="card"><h2>Database error</h2><p>${esc(e.message)}</p><p class="muted">Run the SQL file in Supabase SQL Editor.</p></div>`}}function go(p,b){page=p;document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b?.classList.add('active');render()}function openModal(t,b){mt.textContent=t;mb.innerHTML=b;modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}
function officerSelect(id){return `<div><label>Officer</label><select id="${id}"><option value="">Unassigned</option>${D.officers.map(o=>`<option value="${o.id}">${esc(o.collar_number+' — '+o.first_name+' '+o.last_name)}</option>`).join('')}</select></div>`}function personSelect(id){return `<div><label>Person</label><select id="${id}"><option value="">Unlinked</option>${D.persons.map(p=>`<option value="${p.id}">${esc(p.reference+' — '+p.first_name+' '+p.last_name)}</option>`).join('')}</select></div>`}function caseSelect(id){return `<div><label>Case</label><select id="${id}"><option value="">Unlinked</option>${D.cases.map(c=>`<option value="${c.id}">${esc(c.case_number+' — '+c.title)}</option>`).join('')}</select></div>`}
function render(){if(page==='dashboard')app.innerHTML=dashboard();if(page==='cases')app.innerHTML=cases();if(page==='incidents')app.innerHTML=incidents();if(page==='people')app.innerHTML=people();if(page==='officers')app.innerHTML=officers();if(page==='evidence')app.innerHTML=evidence();if(page==='statements')app.innerHTML=statements();if(page==='tasks')app.innerHTML=tasks();if(page==='reports')app.innerHTML=reports();if(page==='search')app.innerHTML=search()}
function dashboard(){let open=D.cases.filter(x=>x.status!=='Closed').length;return `<h1>Command Dashboard</h1><p class="muted">Investigation and records overview</p><div class="statgrid" style="margin:18px 0"><div class="stat">Cases<b>${D.cases.length}</b></div><div class="stat">Open<b>${open}</b></div><div class="stat">People<b>${D.persons.length}</b></div><div class="stat">Evidence<b>${D.evidence.length}</b></div></div><div class="card"><h2>Recent Cases</h2>${D.cases.slice(0,8).map(c=>`<p><b>${esc(c.case_number)}</b> — ${esc(c.title)} <span class="badge">${esc(c.status)}</span></p>`).join('')||'<div class="empty">No cases.</div>'}</div>`}
function table(title,head,body,addBtn){return `<div class="row"><div><h1>${title}</h1><p class="muted">Records management</p></div>${addBtn||''}</div><div class="card"><div style="overflow:auto"><table><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr>${body||`<tr><td colspan="${head.length}" class="empty">No records.</td></tr>`}</table></div></div>`}
function cases(){return table('Cases',['Case','Title','Status','Priority','Category','Actions'],D.cases.map(c=>`<tr><td>${esc(c.case_number)}</td><td>${esc(c.title)}</td><td>${esc(c.status)}</td><td>${esc(c.priority)}</td><td>${esc(c.category)}</td><td><button class="secondary" onclick="caseView('${c.id}')">Open</button><button class="danger" onclick="remove('cases','${c.id}')">Delete</button></td></tr>`).join(''),`<button class="primary" onclick="newCase()">+ New Case</button>`)}
function incidents(){return table('Incidents',['Number','Title','Type','Status','Priority','Location','Actions'],D.incidents.map(x=>`<tr><td>${esc(x.incident_number)}</td><td>${esc(x.title)}</td><td>${esc(x.incident_type)}</td><td>${esc(x.status)}</td><td>${esc(x.priority)}</td><td>${esc(x.location)}</td><td><button class="danger" onclick="remove('incidents','${x.id}')">Delete</button></td></tr>`).join(''),`<button class="primary" onclick="newIncident()">+ Log Incident</button>`)}
function people(){return table('People',['Reference','Name','DOB','Phone','Email','Actions'],D.persons.map(x=>`<tr><td>${esc(x.reference)}</td><td>${esc(x.first_name+' '+x.last_name)}</td><td>${esc(x.date_of_birth||'')}</td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td><td><button class="danger" onclick="remove('persons','${x.id}')">Delete</button></td></tr>`).join(''),`<button class="primary" onclick="newPerson()">+ Add Person</button>`)}
function officers(){return table('Officers',['Collar','Name','Rank','Department','Status','Actions'],D.officers.map(x=>`<tr><td>${esc(x.collar_number)}</td><td>${esc(x.first_name+' '+x.last_name)}</td><td>${esc(x.rank)}</td><td>${esc(x.department)}</td><td>${esc(x.status)}</td><td><button class="danger" onclick="remove('officers','${x.id}')">Delete</button></td></tr>`).join(''),`<button class="primary" onclick="newOfficer()">+ Add Officer</button>`)}
function evidence(){return table('Evidence',['Number','Description','Type','Case','Storage','Status','Actions'],D.evidence.map(x=>`<tr><td>${esc(x.evidence_number)}</td><td>${esc(x.description)}</td><td>${esc(x.evidence_type)}</td><td>${esc(D.cases.find(c=>c.id===x.case_id)?.case_number||'')}</td><td>${esc(x.storage_location)}</td><td>${esc(x.status)}</td><td><button class="danger" onclick="remove('evidence','${x.id}')">Delete</button></td></tr>`).join(''),`<button class="primary" onclick="newEvidence()">+ Register Evidence</button>`)}
function statements(){return table('Statements',['Number','Person','Taken','Status','Actions'],D.statements.map(x=>`<tr><td>${esc(x.statement_number)}</td><td>${esc(D.persons.find(p=>p.id===x.person_id)?.first_name||'')}</td><td>${esc(x.taken_at||'')}</td><td>${esc(x.status)}</td><td><button class="danger" onclick="remove('statements','${x.id}')">Delete</button></td></tr>`).join(''),`<button class="primary" onclick="newStatement()">+ Add Statement</button>`)}
function tasks(){return table('Tasks',['Task','Case','Assigned','Priority','Status','Due','Actions'],D.tasks.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(D.cases.find(c=>c.id===x.case_id)?.case_number||'')}</td><td>${esc(D.officers.find(o=>o.id===x.assigned_to)?.last_name||'')}</td><td>${esc(x.priority)}</td><td>${esc(x.status)}</td><td>${esc(x.due_at||'')}</td><td><button class="danger" onclick="remove('tasks','${x.id}')">Delete</button></td></tr>`).join(''),`<button class="primary" onclick="newTask()">+ New Task</button>`)}
function reports(){return table('Reports',['Number','Title','Type','Case','Status','Actions'],D.reports.map(x=>`<tr><td>${esc(x.report_number)}</td><td>${esc(x.title)}</td><td>${esc(x.report_type)}</td><td>${esc(D.cases.find(c=>c.id===x.case_id)?.case_number||'')}</td><td>${esc(x.status)}</td><td><button class="secondary" onclick="printReport('${x.id}')">Print</button> <button class="danger" onclick="remove('reports','${x.id}')">Delete</button></td></tr>`).join(''),`<button class="primary" onclick="newReport()">+ New Report</button>`)}
function search(){return `<h1>Global Search</h1><div class="card"><input id="q" placeholder="Search cases, people, incidents..." oninput="doSearch(this.value)"><div id="results"></div></div>`}function doSearch(q){q=q.toLowerCase();let a=[];D.cases.forEach(x=>{if((x.case_number+' '+x.title+' '+x.category).toLowerCase().includes(q))a.push('<p><b>CASE</b> '+esc(x.case_number)+' — '+esc(x.title)+'</p>')});D.persons.forEach(x=>{if((x.reference+' '+x.first_name+' '+x.last_name).toLowerCase().includes(q))a.push('<p><b>PERSON</b> '+esc(x.reference)+' — '+esc(x.first_name+' '+x.last_name)+'</p>')});D.incidents.forEach(x=>{if((x.incident_number+' '+x.title+' '+x.location).toLowerCase().includes(q))a.push('<p><b>INCIDENT</b> '+esc(x.incident_number)+' — '+esc(x.title)+'</p>')});results.innerHTML=q?(a.join('')||'<p>No matches.</p>'):''}
function newCase(){openModal('New Case',`<div class="grid">${form('Case Number','cn','CASE-'+Math.floor(Math.random()*900000+100000))}${form('Title','ct')}${sel('Status','cs',['Open','Under Investigation','Closed','Suspended'],'Open')}${sel('Priority','cp',['Low','Medium','High','Critical'],'Medium')}${form('Category','cc')}${officerSelect('co')}${form('Summary','cx','',true)}</div><div class="actions"><button class="primary" onclick="saveCase()">Create Case</button></div>`)}async function saveCase(){await add('cases',{case_number:v('cn'),title:v('ct'),status:v('cs'),priority:v('cp'),category:v('cc'),lead_officer_id:v('co')||null,summary:v('cx')});closeModal();await loadAll()}
function newIncident(){openModal('Log Incident',`<div class="grid">${form('Incident Number','in','INC-'+Math.floor(Math.random()*900000+100000))}${form('Title','it')}${form('Type','ity','Other')}${sel('Status','is',['Open','Under Investigation','Closed'],'Open')}${sel('Priority','ip',['Low','Medium','High','Critical'],'Medium')}${form('Location','il')}${form('Occurred At','io',new Date().toISOString().slice(0,16))}${form('Description','ix','',true)}</div><div class="actions"><button class="primary" onclick="saveIncident()">Save Incident</button></div>`)}async function saveIncident(){await add('incidents',{incident_number:v('in'),title:v('it'),incident_type:v('ity'),status:v('is'),priority:v('ip'),location:v('il'),occurred_at:v('io'),description:v('ix')});closeModal();await loadAll()}
function newPerson(){openModal('Add Person',`<div class="grid">${form('Reference','pr','PER-'+Math.floor(Math.random()*900000+100000))}${form('First Name','pf')}${form('Middle Name','pm')}${form('Last Name','pl')}${form('Date of Birth','pd')}${form('Gender','pg')}${form('Address','pa')}${form('Phone','pp')}${form('Email','pe')}${form('Notes','pn','',true)}</div><div class="actions"><button class="primary" onclick="savePerson()">Save Person</button></div>`)}async function savePerson(){await add('persons',{reference:v('pr'),first_name:v('pf'),middle_name:v('pm'),last_name:v('pl'),date_of_birth:v('pd')||null,gender:v('pg'),address:v('pa'),phone:v('pp'),email:v('pe'),notes:v('pn')});closeModal();await loadAll()}
function newOfficer(){openModal('Add Officer',`<div class="grid">${form('Collar Number','oc')}${form('First Name','of')}${form('Last Name','ol')}${form('Rank','or','Officer')}${form('Department','od')}${form('Email','oe')}${form('Phone','op')}${sel('Status','os',['Active','Suspended','Leave','Retired'],'Active')}</div><div class="actions"><button class="primary" onclick="saveOfficer()">Save Officer</button></div>`)}async function saveOfficer(){await add('officers',{collar_number:v('oc'),first_name:v('of'),last_name:v('ol'),rank:v('or'),department:v('od'),email:v('oe'),phone:v('op'),status:v('os')});closeModal();await loadAll()}
function newEvidence(){openModal('Register Evidence',`<div class="grid">${form('Evidence Number','en','EV-'+Math.floor(Math.random()*900000+100000))}${form('Description','ed')}${form('Type','et','Physical')}${caseSelect('ec')}${form('Found At','ef')}${form('Collected At','ev',new Date().toISOString().slice(0,16))}${officerSelect('eo')}${form('Storage Location','es')}${sel('Status','ex',['Collected','In Storage','Released','Returned','Destroyed'],'In Storage')}${form('Notes','em','',true)}</div><div class="actions"><button class="primary" onclick="saveEvidence()">Register Evidence</button></div>`)}async function saveEvidence(){await add('evidence',{evidence_number:v('en'),description:v('ed'),evidence_type:v('et'),case_id:v('ec')||null,found_at:v('ef'),collected_at:v('ev'),collected_by:v('eo')||null,storage_location:v('es'),status:v('ex'),notes:v('em')});closeModal();await loadAll()}
function newStatement(){openModal('Add Statement',`<div class="grid">${form('Statement Number','sn','ST-'+Math.floor(Math.random()*900000+100000))}${personSelect('sp')}${caseSelect('sc')}${officerSelect('so')}${form('Taken At','st',new Date().toISOString().slice(0,16))}${form('Location','sl')}${sel('Status','ss',['Draft','Recorded','Reviewed','Final'],'Draft')}${form('Statement Text','sx','',true)}</div><div class="actions"><button class="primary" onclick="saveStatement()">Save Statement</button></div>`)}async function saveStatement(){await add('statements',{statement_number:v('sn'),person_id:v('sp')||null,case_id:v('sc')||null,officer_id:v('so')||null,taken_at:v('st'),location:v('sl'),status:v('ss'),statement_text:v('sx')});closeModal();await loadAll()}
function newTask(){openModal('New Task',`<div class="grid">${form('Title','tt')}${caseSelect('tc')}${officerSelect('to')}${sel('Priority','tp',['Low','Medium','High','Critical'],'Medium')}${sel('Status','ts',['Open','In Progress','Complete','Cancelled'],'Open')}${form('Due At','td')}${form('Description','tx','',true)}</div><div class="actions"><button class="primary" onclick="saveTask()">Create Task</button></div>`)}async function saveTask(){await add('tasks',{title:v('tt'),case_id:v('tc')||null,assigned_to:v('to')||null,priority:v('tp'),status:v('ts'),due_at:v('td')||null,description:v('tx')});closeModal();await loadAll()}
function newReport(){openModal('New Report',`<div class="grid">${form('Report Number','rn','REP-'+Math.floor(Math.random()*900000+100000))}${form('Title','rt')}${form('Type','ry','General')}${caseSelect('rc')}${officerSelect('ro')}${sel('Status','rs',['Draft','Submitted','Reviewed','Final'],'Draft')}${form('Report Body','rb','',true)}</div><div class="actions"><button class="primary" onclick="saveReport()">Save Report</button></div>`)}async function saveReport(){await add('reports',{report_number:v('rn'),title:v('rt'),report_type:v('ry'),case_id:v('rc')||null,author_id:v('ro')||null,status:v('rs'),body:v('rb')});closeModal();await loadAll()}
async function remove(t,id){if(confirm('Delete this record?')){try{await del(t,id);await loadAll()}catch(e){alert(e.message)}}}
function caseView(id){let c=D.cases.find(x=>x.id===id);let ev=D.events.filter(x=>x.case_id===id);openModal('Case '+c.case_number,`<h2>${esc(c.title)}</h2><p><b>Status:</b> ${esc(c.status)} &nbsp; <b>Priority:</b> ${esc(c.priority)}</p><h3>Summary</h3><p>${esc(c.summary)}</p><h3>Timeline</h3>${ev.map(e=>`<p><b>${esc(e.title)}</b><br>${esc(e.event_at)}<br>${esc(e.details)}</p>`).join('')||'<p>No events.</p>'}<div class="actions"><button class="primary" onclick="printCase('${id}')">Print 80mm Summary</button></div>`)}
function printCase(id){let c=D.cases.find(x=>x.id===id);let w=window.open('','_blank','width=420,height=800');if(!w){alert('Allow pop-ups for this site.');return}w.document.write(`<html><head><title>${esc(c.case_number)}</title><style>@page{size:80mm auto;margin:0}body{width:72mm;margin:auto;font:10pt Arial;color:#000}h1{text-align:center;font-size:14pt}h2{font-size:11pt;border-bottom:1px solid #000}p{white-space:pre-wrap}</style></head><body><h1>VIBE-HOLDINGS<br>CASE SUMMARY</h1><b>${esc(c.case_number)}</b><p>${esc(c.title)}</p><h2>SUMMARY</h2><p>${esc(c.summary)}</p><h2>STATUS</h2><p>${esc(c.status)} / ${esc(c.priority)}</p><script>onload=()=>setTimeout(()=>print(),300)<\/script></body></html>`);w.document.close()}
function printReport(id){let r=D.reports.find(x=>x.id===id);let w=window.open('','_blank');if(!w){alert('Allow pop-ups for this site.');return}w.document.write(`<html><body style="font:14px Arial;padding:30px"><h1>${esc(r.title)}</h1><p>${esc(r.report_number)} • ${esc(r.report_type)}</p><pre style="white-space:pre-wrap;font:inherit">${esc(r.body)}</pre><script>onload=()=>setTimeout(()=>print(),300)<\/script></body></html>`);w.document.close()}
loadAll();
</script></body></html>
