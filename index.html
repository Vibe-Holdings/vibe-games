<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Police System Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eef2f6;font-family:Arial,sans-serif;color:#17212b}
.login{width:min(420px,calc(100% - 30px));background:#fff;border:1px solid #dbe2e8;border-radius:14px;padding:30px;box-shadow:0 12px 35px #00000012}
.logo{text-align:center;margin-bottom:24px}
.logo .mark{width:64px;height:64px;border-radius:14px;background:#102a43;color:#fff;display:flex;align-items:center;justify-content:center;margin:auto;font-size:27px;font-weight:900}
h1{text-align:center;margin:16px 0 4px;font-size:23px}
.sub{text-align:center;color:#687585;font-size:12px;margin-bottom:24px}
label{display:block;font-size:12px;font-weight:800;margin:12px 0 5px}
input{width:100%;padding:12px;border:1px solid #cbd5df;border-radius:8px;font:inherit}
button{width:100%;border:0;border-radius:8px;padding:12px;margin-top:18px;background:#173f5f;color:#fff;font-weight:800;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.error{display:none;margin-top:14px;padding:10px;border-radius:7px;background:#fee2e2;color:#991b1b;font-size:12px}
.footer{text-align:center;margin-top:20px;color:#8a96a3;font-size:10px}
</style>

<style id="anti-zoom">
html,body{touch-action:pan-x pan-y;overscroll-behavior:none}
</style>
<script id="anti-zoom-script">
(function(){
  document.addEventListener('wheel',function(e){
    if(e.ctrlKey){e.preventDefault();}
  },{passive:false});
  document.addEventListener('keydown',function(e){
    if(e.ctrlKey && (e.key==='+' || e.key==='-' || e.key==='=' || e.key==='0')){
      e.preventDefault();
    }
  },{passive:false});
  document.addEventListener('gesturestart',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('gesturechange',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('gestureend',function(e){e.preventDefault();},{passive:false});
})();
</script>

</head>
<body>
<div class="login">
  <div class="logo">
    <div class="mark">VH</div>
    <h1>Police Management System</h1>
    <div class="sub">Vibe-Holdings • Secure Officer Access</div>
  </div>

  <form id="loginForm">
    <label for="username">Officer Username</label>
    <input id="username" autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>

    <button id="loginBtn" type="submit">Sign In</button>
    <div id="error" class="error"></div>
  </form>

  <div class="footer">Authorised personnel only</div>
</div>

<script>
const SUPABASE_URL="https://hrqhwfbhqpjhmuvdrrzp.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhycWh3ZmJocXBqaG11dmRycnpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0Mjk3MzksImV4cCI6MjEwMzAwNTczOX0.s3PFWbFOqw8tvlviwYQ8ujutdvU3B1iEJq3R8w_DSSc";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

document.getElementById("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=document.getElementById("loginBtn");
  const err=document.getElementById("error");
  err.style.display="none";
  btn.disabled=true;
  btn.textContent="Signing in…";

  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value;

  try{
    const {data,error}=await sb
      .from("user_accounts")
      .select("id,username,password_hash,officer_id,role,status")
      .eq("username",username)
      .maybeSingle();

    if(error) throw error;

    if(!data){
      // Embedded administrator account for the private/demo deployment.
      if(username === "Rossi Fleming" && password === "20113"){
        sessionStorage.setItem("police_session",JSON.stringify({
          id:"embedded-admin",
          username:"Rossi Fleming",
          officer_id:null,
          role:"Administrator",
          logged_in_at:new Date().toISOString()
        }));
        window.location.href="/menu.html";
        return;
      }
      throw new Error("Invalid username or password.");
    }

    if(data.status!=="Active" || data.password_hash!==password){
      throw new Error("Invalid username or password.");
    }

    if(data.officer_id){
      await sb.from("officer_activity").insert({
        officer_id:data.officer_id,
        activity_type:"Login",
        details:{username:data.username,role:data.role}
      });
    }

    sessionStorage.setItem("police_session",JSON.stringify({
      id:data.id,
      username:data.username,
      officer_id:data.officer_id,
      role:data.role,
      logged_in_at:new Date().toISOString()
    }));

    // Change this if your main police system is hosted at another path.
    window.location.href="/menu.html";
  }catch(ex){
    err.textContent=ex.message||"Login failed.";
    err.style.display="block";
  }finally{
    btn.disabled=false;
    btn.textContent="Sign In";
  }
});
</script>
</body>
</html>
