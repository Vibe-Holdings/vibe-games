<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ID Issuer — Vibe-Holdings</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#17212b;font-family:Arial,sans-serif}
header{background:#102a43;color:#fff;padding:16px 20px;font-weight:800}header small{display:block;font-size:10px;color:#cbd5df;margin-top:3px}
main{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dbe2e8;border-radius:12px;padding:18px;margin-bottom:15px}
label{display:block;font-size:12px;font-weight:800;margin:11px 0 5px}input,select{width:100%;padding:11px;border:1px solid #cbd5df;border-radius:8px;font:inherit}
button{padding:11px 15px;border:0;border-radius:8px;font-weight:800;cursor:pointer}.primary{background:#173f5f;color:#fff}.secondary{background:#e6edf3;color:#173047}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.muted{color:#687585;font-size:12px}.result{margin-top:10px;padding:12px;background:#f5f7f9;border-radius:9px}
.notice{padding:12px;border-radius:9px;margin-bottom:12px}.ok{background:#dcfce7;color:#166534}.error{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<header>Vibe-Holdings ID Issuer<small>SIMULATION — NOT A GOVERNMENT / DVLA SERVICE</small></header>
<main>
<div id="notice"></div>
<div class="card">
<h2>Issue SIM ID</h2><p class="muted">Type a person's name and select the existing database record.</p>
<label>Person name</label><input id="search" placeholder="Start typing a name..." autocomplete="off">
<div id="matches"></div><div id="selected"></div>
<div id="details" style="display:none">
<label>Issue date</label><input id="issued" type="date">
<label>Expiry date</label><input id="expires" type="date">
<label>Status</label><select id="status"><option>Active</option><option>Suspended</option></select>
<div class="actions"><button class="primary" id="issue">Issue ID</button><button class="secondary" onclick="location.href='menu.html'">Back to Menu</button></div>
</div>
</div>
<div class="card" id="issuedCard" style="display:none">
<h2>ID Issued</h2><div id="issuedInfo" class="result"></div>
<div class="actions"><button class="primary" id="sendPrint">🖨 Send to PC Printer</button></div>
<p class="muted">Printing is sent to the PC Python service. No browser print dialog is used.</p>
</div>
</main>
<script>
const SUPABASE_URL="https://hrqhwfbhqpjhmuvdrrzp.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhycWh3ZmJocXBqaG11dmRycnpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0Mjk3MzksImV4cCI6MjEwMzAwNTczOX0.s3PFWbFOqw8tvlviwYQ8ujutdvU3B1iEJq3R8w_DSSc";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nameOf=p=>[p?.first_name,p?.middle_name,p?.last_name].filter(Boolean).join(" ")||"Unnamed";
let people=[],selected=null,currentId=null;
function notice(t,err=false){$("notice").innerHTML=`<div class="notice ${err?"error":"ok"}">${esc(t)}</div>`}
async function loadPeople(){try{const r=await sb.from("persons").select("*").order("last_name",{ascending:true});if(r.error)throw r.error;people=r.data||[]}catch(e){notice("Could not load People: "+e.message,true)}}
$("search").oninput=()=>{
 const q=$("search").value.trim().toLowerCase();if(q.length<2){$("matches").innerHTML="";return}
 const m=people.filter(p=>(nameOf(p)+" "+(p.reference||"")).toLowerCase().includes(q)).slice(0,10);
 $("matches").innerHTML=m.map(p=>`<button class="secondary" style="width:100%;text-align:left;margin-top:6px" data-id="${esc(p.id)}"><b>${esc(nameOf(p))}</b><br><span class=muted>${esc(p.reference||"")}</span></button>`).join("")||"<div class=result>No matching person.</div>";
 $("matches").querySelectorAll("button").forEach(b=>b.onclick=()=>selectPerson(b.dataset.id));
};
function selectPerson(id){selected=people.find(p=>p.id===id);if(!selected)return;$("search").value=nameOf(selected);$("matches").innerHTML="";$("selected").innerHTML=`<div class=result><b>Selected:</b> ${esc(nameOf(selected))}<br><span class=muted>${esc(selected.reference||"")}</span></div>`;$("details").style.display="block"}
$("issued").value=new Date().toISOString().slice(0,10);
$("issue").onclick=async()=>{
 if(!selected){notice("Select a person first.",true);return}
 const token="VH-SIM-"+crypto.randomUUID().replaceAll("-","").toUpperCase();
 try{
  const r=await sb.from("sim_ids").insert({person_id:selected.id,token,status:$("status").value,issued_at:new Date($("issued").value+"T00:00:00").toISOString(),expires_at:$("expires").value?new Date($("expires").value+"T23:59:59").toISOString():null}).select().single();
  if(r.error)throw r.error;
  currentId=r.data;
  $("issuedInfo").innerHTML=`<b>${esc(nameOf(selected))}</b><br>Reference: ${esc(selected.reference||"—")}<br>SIM ID: <b>${esc(token)}</b><br>Status: ${esc(r.data.status)}<br><span class=muted>SIMULATION — NOT A GOVERNMENT ID</span>`;
  $("issuedCard").style.display="block";notice("SIM ID issued successfully.");
 }catch(e){notice("Could not issue ID: "+e.message,true)}
};
$("sendPrint").onclick=async()=>{
 if(!currentId||!selected){notice("Issue the ID first.",true);return}
 const b=$("sendPrint");b.disabled=true;b.textContent="Sending…";
 try{
  const r=await sb.from("ticket_print_queue").insert({ticket_id:null,person_id:selected.id,sim_id:currentId.id,job_type:"sim_id",status:"Queued"});
  if(r.error)throw r.error;
  b.textContent="✓ Sent to PC Printer";notice("ID sent to the PC printer.");
 }catch(e){console.error(e);b.disabled=false;b.textContent="🖨 Send to PC Printer";notice("ID was created, but printing is unavailable. The ID is safe.",true)}
};
loadPeople();
</script>
</body></html>
