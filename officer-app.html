<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VHPD — Vibe-Holdings Police Department</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#eef2f6;color:#17212b}
header{height:62px;background:#102a43;color:#fff;display:flex;align-items:center;padding:0 16px;gap:10px;position:sticky;top:0;z-index:5}
.logo{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:8px}.brand b{font-size:18px}.brand small{display:block;font-size:10px}
main{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d8e0e8;border-radius:12px;padding:16px;margin-bottom:14px}
button{border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#173f5f;color:#fff}.secondary{background:#e7edf2;color:#173047}
input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5df;border-radius:8px;font:inherit}label{display:block;font-size:12px;font-weight:800;margin:10px 0 5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.service{background:#fff;border:1px solid #d8e0e8;border-radius:12px;padding:16px;cursor:pointer}.muted{font-size:12px;color:#687786}
footer{text-align:center;color:#687786;font-size:11px;padding:20px}
@media(max-width:700px){main{padding:12px}.grid{grid-template-columns:repeat(2,1fr)}button{min-height:44px}}
</style></head><body>
<header><img class="logo" src="https://cdn.phototourl.com/free/2026-08-26-86cb6b53-6054-4849-8cbc-f163d7ac51c4.png"><div class="brand"><b>VHPD</b><small>Vibe-Holdings Police Department</small></div></header>
<main>
<h1>Hello, <span id="who">Officer</span></h1>
<p class="muted">Services available</p>
<div class="grid" id="services">
<button class="service" type="button" data-action="people">👤<b>People Lookup</b><span class="muted">Search people</span></button>
<button class="service" type="button" data-action="scanner">📷<b>Scan ID</b><span class="muted">Scan a SIM ID</span></button>
<button class="service" type="button" data-action="tickets">🎫<b>Tickets</b><span class="muted">Ticket services</span></button>
<button class="service" type="button" data-action="cases">📁<b>Cases</b><span class="muted">Case services</span></button>
<button class="service" type="button" data-action="requests">📋<b>Requests</b><span class="muted">Data requests</span></button>
<button class="service" type="button" data-action="evidence">📸<b>Evidence</b><span class="muted">Capture evidence</span></button>
<button class="service" type="button" data-action="statements">📝<b>Statements</b><span class="muted">Record statements</span></button>
<button class="service" type="button" data-action="idissuer">🪪<b>ID Issuer</b><span class="muted">Issue SIM IDs</span></button>
</div>
<div id="notice"></div><div id="area"></div>

<script>
document.addEventListener("DOMContentLoaded",()=>{
const sb=supabase.createClient("https://hrqhwfbhqpjhmuvdrrzp.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhycWh3ZmJocXBqaG11dmRycnpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0Mjk3MzksImV4cCI6MjEwMzAwNTczOX0.s3PFWbFOqw8tvlviwYQ8ujutdvB3U1iEJq3R8w_DSSc");
const $=x=>document.getElementById(x),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const officer=JSON.parse(localStorage.getItem("vhpd_officer")||"null");const name=p=>[p?.first_name,p?.middle_name,p?.last_name].filter(Boolean).join(" ")||"Officer";
$("who").textContent=name(officer);let people=[],qr=null;
function msg(t,e=false){$("notice").innerHTML=`<div class="notice ${e?"error":"ok"}">${esc(t)}</div>`}
function area(x){$("area").innerHTML=x}
async function peoplePage(){
 area("<div class=card><h2>People Lookup</h2><input id=ps placeholder='Search name or reference...'><div id=pr>Loading…</div></div>");
 let r=await sb.from("persons").select("*").order("last_name");if(r.error)return msg(r.error.message,true);people=r.data||[];renderPeople();$("ps").oninput=renderPeople
}
function renderPeople(){let q=($("ps").value||"").toLowerCase();$("pr").innerHTML=people.filter(p=>(name(p)+" "+(p.reference||"")).toLowerCase().includes(q)).map(p=>`<div class=card><b>${esc(name(p))}</b><div class=muted>${esc(p.reference||"")}</div><span class="badge ${p.locked?"warn":"ok"}">${p.locked?"LOCKED":"AVAILABLE"}</span><button class=secondary data-open="${p.id}" type=button>Open</button></div>`).join("")||"<p class=muted>No people found.</p>";document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openPerson(b.dataset.open))}
function openPerson(id){let p=people.find(x=>String(x.id)===String(id));if(!p)return;if(p.locked){area("<div class=card><h2>Profile Locked</h2><p>This profile requires an authorised data request.</p><button class=primary id=req>Submit Data Request</button></div>");$("req").onclick=()=>requestPage(p);return}area(`<div class=card><h2>${esc(name(p))}</h2><p>Reference: ${esc(p.reference||"—")}</p><p>DOB: ${esc(p.date_of_birth||"—")}</p><p>Address: ${esc(p.address||"—")}</p><button class=primary id=pl>🖨 Send to PC Printer</button></div>`);$("pl").onclick=async()=>{let r=await sb.from("ticket_print_queue").insert({ticket_id:null,person_id:p.id,job_type:"person_lookup",status:"Queued"});if(r.error)msg(r.error.message,true);else msg("Lookup sent to PC printer.")}}
function requestPage(p){let rid="DR-"+Date.now().toString().slice(-8);area(`<div class=card><h2>Data Request</h2><label>Officer</label><input readonly value="${esc(name(officer))}"><label>Person</label><input readonly value="${esc(name(p))}"><label>Person Reference</label><input readonly value="${esc(p.reference||"")}"><label>Request ID</label><input readonly value="${rid}"><label>Why are you requesting this data?</label><textarea id=rr></textarea><button class=primary id=sr>Submit Data Request</button></div>`);$("sr").onclick=async()=>{let reason=$("rr").value.trim();if(!reason)return msg("Enter why you are requesting this data.",true);let r=await sb.from("data_requests").insert({request_number:rid,officer_id:officer?.id||null,person_id:p.id,reason,status:"Pending",requested_at:new Date().toISOString()}).select().single();if(r.error)return msg(r.error.message,true);try{await sb.from("ticket_print_queue").insert({ticket_id:null,person_id:p.id,job_type:"data_request",status:"Queued",data_request_id:r.data.id})}catch(e){}area(`<div class=card><h2>Data Form Submitted</h2><p>Request ${esc(rid)} is Pending.</p><p>It will automatically approve in 50 seconds.</p></div>`);setTimeout(()=>sb.from("data_requests").update({status:"Approved",approved_at:new Date().toISOString()}).eq("id",r.data.id),50000)}}
async function scannerPage(){area("<div class=card><h2>SIM ID Scanner</h2><div id=reader></div><button class=primary id=sc>Start Camera</button> <button class=secondary id=st>Stop</button><label>Manual token</label><input id=tok placeholder='VH-SIM-...'><button class=secondary id=lu>Look Up</button><div id=srch></div></div>");$("sc").onclick=start; $("st").onclick=stop; $("lu").onclick=lookup}
async function start(){if(typeof Html5Qrcode==="undefined")return msg("Scanner library failed to load.",true);try{await stop();qr=new Html5Qrcode("reader");await qr.start({facingMode:"environment"},{fps:10,qrbox:250},async t=>{$("tok").value=t;await lookup();await stop()},()=>{})}catch(e){msg("Camera unavailable. Use HTTPS and allow camera access.",true)}}
async function stop(){if(qr){try{await qr.stop()}catch(e){}try{qr.clear()}catch(e){}qr=null}}
async function lookup(){let t=($("tok").value||"").trim();if(!t)return;let r=await sb.from("sim_ids").select("*,persons(*)").eq("token",t).maybeSingle();if(r.error)return msg(r.error.message,true);if(!r.data)return msg("ID not found.",true);$("srch").innerHTML=`<div class=card><span class="badge ok">ACTIVE</span><h2>${esc(name(r.data.persons))}</h2><p>Reference: ${esc(r.data.persons?.reference||"—")}</p><p>SIM ID: ${esc(r.data.token)}</p></div>`}
function ticketsPage(){area("<div class=card><h2>Tickets</h2><p>Ticket printing uses the PC printer service.</p></div>")}
function casesPage(){area("<div class=card><h2>Cases</h2><p>Open the Police System for case management.</p><button class=primary id=oc>Open Police System</button></div>");$("oc").onclick=()=>location.href="police-system.html"}
async function requestsPage(){let r=await sb.from("data_requests").select("*").order("requested_at",{ascending:false});area(`<div class=card><h2>Requests</h2>${r.error?`<div class="notice error">${esc(r.error.message)}</div>`:(r.data||[]).map(x=>`<div class=card><b>${esc(x.request_number)}</b> — ${esc(x.status)}<p class=muted>${esc(x.reason)}</p></div>`).join("")||"<p>No requests.</p>"}</div>`)}
function evidencePage(){area("<div class=card><h2>Evidence</h2><input type=file accept='image/*' capture='environment' multiple><p class=muted>Take or select evidence photos.</p></div>")}
function statementsPage(){area("<div class=card><h2>Statements</h2><textarea placeholder='Type statement...'></textarea><label>Officer e-signature</label><input placeholder='Type full name'><button class=primary type=button>Save Statement</button></div>")}
function idPage(){location.href="id-issuer.html"}
const actions={people:peoplePage,scanner:scannerPage,tickets:ticketsPage,cases:casesPage,requests:requestsPage,evidence:evidencePage,statements:statementsPage,idissuer:idPage};
document.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>actions[b.dataset.action]()));
});
</script>
<footer>Roleplay System</footer></body></html>
